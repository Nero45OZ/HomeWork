<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HomeWork-(Form)</title>
    <link rel="stylesheet" href="./CSS/style.css">
</head>

<body>
    <form class="form">
        <fieldset class="form-group">
            <legend class="form-group-title">Ваши личные данные</legend>
            <label for="name" class="label">Ваше Имя</label>
            <input
                id="name"
                class="input"
                type="text"
                placeholder="Имя"
                name="name"
                required>

            <label for="age" class="label">Ваш возраст</label>
            <input
                id="age"
                class="input"
                type="number"
                placeholder="Возраст"
                name="age"
                min="0"
                required>

            <label for="phone" class="label">Ваш телефон</label>
            <input
                id="phone"
                class="input"
                type="tel"
                inputmode="tel"
                placeholder="Номер"
                name="phone"
                required>

            <label for="email" class="label">Ваша почта</label>
            <input
                id="email"
                class="input"
                type="email"
                placeholder="Почта"
                name="email"
                required>
        </fieldset>
        <fieldset class="form-group">
            <label for="message" class="label">Соообщение</label>
            <textarea
                id="message"
                class="textarea"
                placeholder="Ваше сообщение"
                name="message"
                required
                ></textarea>
        </fieldset>
        <label class="label">
            <input
                class="checkbox"
                type="checkbox"
                name="checkbox">
            <span class="check-text">Соглашаюсь</span>
        </label>
        <button class="button">отправить</button>
    </form>
</body>

</html>
